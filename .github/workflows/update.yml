name: Update data
on:
  schedule:
    - cron: "30 14 * * *"   # daily, 8:30am Mountain
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshots.json
          git diff --cached --quiet || git commit -m "Update absentee counts" && git push
