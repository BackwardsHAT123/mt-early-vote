name: Update results
on:
  schedule:
    # Election night (UTC): every 10 minutes from Nov 4 through Nov 6 (7:40 p.m. MT Nov 3 = 02:40 UTC Nov 4)
    - cron: "*/10 * 4-6 11 *"
    # Then daily through the canvass period
    - cron: "0 15 7-30 11 *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: results
  cancel-in-progress: false
jobs:
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests openpyxl
      - run: python3 scripts/results.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Update election results" && git pull --rebase origin main && git push)
